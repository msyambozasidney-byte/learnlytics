{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width:500px;border-radius:20px;">

        <h2 class="text-center mb-4">
            Create New Password
        </h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary w-100">
                Update Password
            </button>
        </form>

    </div>
</div>

{% endblock %}
