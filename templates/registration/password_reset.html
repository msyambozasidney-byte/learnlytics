{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card mx-auto p-4 shadow" style="max-width:500px;border-radius:20px;">

        <h2 class="text-center mb-4">
            Reset Password
        </h2>

        <p class="text-muted text-center">
            Enter your email to receive a reset link.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                {{ form.email }}
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Send Reset Link
            </button>

        </form>

    </div>
</div>

{% endblock %}
