<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card { display: inline-block; padding: 20px; margin: 10px; background: #f0f0f0;
border-radius: 1opx; width: 180px; text-align: center; }
        .card h2 { margin: 0; font-size: 2em; }
    </style>
</head>
<body>
    <h1>Welcome, {{ user.username }}!</h1>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

    <h2>Dashboard</h2>
    <div class="card">
        <h2>{{ total_students }}</h2>
        <p>Students</p>
    </div>
    <div class="card">
        <h2>{{ total_teachers }}</h2>
        <p>Teacher</p>
    </div>
    <div class="card">
        <h2>{{ total_classes }}</h2>
        <p>Classes</p>
    </div>
    <div class="card">
        <h2>{{ total_subjects }}</h2>
        <p>Subjects</p>
    </div>
</body>
</html>
