<!DOCTYPE html>
<html>
<head>
    <title>Learnlytics Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card { display: inline-block; padding: 20px; margin: 10px; background: #f5f5f5;
border-radius: 10px; width: 180px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h2 { margin: 0; font-size: 2em; }
        .cards-container { display: flex; flex-wrap: wrap; }
        button.logout { padding: 10px 20px; background: #f44336; color: white; border: none;
border-radius: 5px; cursor: pointer; }
        button.logout.hover { background: #d32f2f; }
    </style>
</head>
<body>
    <h1>Welcome, {{ user.username }}!</h1>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout">Logout</button>
    </form>

    <h2>Dashboard</h2>
    <div class="cards-container">
        <div class="card">
            <h2>{{ total_students }}</h2>
            <p>Students</p>
        </div>
        <div class="card">
            <h2>{{ total_teachers }}</h2>
            <p>Teachers</p>
        </div>
        <div class="card">
            <h2>{{ total_classes }}</h2>
            <p>Classes</p>
        </div>
        <div class="card">
            <h2>{{ total_subjects }}</h2>
            <p>Subjects</p>
        </div>
    </div>
</body>
</html>
