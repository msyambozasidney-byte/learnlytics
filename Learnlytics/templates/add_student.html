<h2>Add Stuent</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-mid-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4">Edit Student</h4>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibol">Student Name</label>
                            <input
type="text"

name="name"

value="{{ student.name }}"

Class="form-control form-control-lg" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Marks</label>
                            <input
type="number"

name="marks"

value="{{ student.marks }}"

class="form-control form-control-lg" min="0" max="100" required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Update Student</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
