<!DOCTYPE html>
<html>
<head>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-4"></div>

    <title>Learnlytics</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
        }

        .sidebar{
            width:220px;
            height:100vh;
            background:#2c3e50;
            position:fixed;
            color:white;
            padding-top:20px;
        }

        .sidebar h2{
            text-align:center;
        }

        .sidebar a{
            display:block;
            padding:15px;
            color:white;
            text-decoration:none;
        }

        .sidebar a:hover{
            background:#34495e;
        }

        .content{
            margin-left:220px;
            padding:20px;
        }

        .cards{
            display:flex;
            gap:20px;
            margin-top:20px;
        }

        .card{
            background:#f4f6f9;
            padding:20px;
            border-radius:8px;
            width:200px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        .card h3{
            margin:0;
            font-size:18px;
        }

        .card p{
            font-size:22px;
            font-weight:bold;
        }


    </style>

</head>

<body>

<div class="sidebar">

<h2>Learnlytics</h2>

<a href="/users/dashboard/">Dashboard</a>
<a href="/users/add-mark/">Enter Marks</a>
<a href="/admin/users/student/">Students</a>
<a href="/admin/users/subject/">Subjects</a>
<a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>

</div>

<div class="content">

{% block content %}
{% endblock %}

</div>

<script
src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
</html>
