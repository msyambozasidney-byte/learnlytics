<h2>Edit Student</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Update</button>
</form>

<div class="container m-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="mb-3">Edit Student</h4>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" value="{{ student.name }}" class="form-control">
                </div>

                <button class="btn btn-primary">Update Student</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-mid-6">
            <div class="card shadow-lg boder-0">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4">Edit Student</h4>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Student Name</label>
                            <input
Type="text"

name="name"

value="{{ student.name }}"

class="form-control form-control-lg" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Marks</label>
                            <input
type="number"

name="marks"

value="{{ student.marks }}"

class="form-control form-control-lg" min="0" max="100" required>
                        </div>
                         
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secongary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Update Student</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
