<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        h2 {
            margin-bottom: 10px;
        }
    </style>

<a href="{% url 'student_report_pdf' student.id %}" class="btn btn-primary">
    Download Student Report
</a>

</head>
<body>

    <h2>Student: {{ student.name }}</h2>

    <p><strong>Class:></strong>{{ student.classroom }}</p>

    <hr>

    <h3>Marks</h3>

    <table>
        <tr>
            <th>Subject</th>
            <th>Mark</th>
        </tr>

        {% for mark in marks %}
        <tr>
            <td>{{ mark.subject.name }}</td>
            <td>{{ mark.score }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No marks availaible for this student</td>
        </tr>
        {% endfor %}
    </table>
    
</body>
</html>
