{% extends 'base_dashboard.html' %}

{% block content %}

<div class="container mt-4">
    <h3>Add Classroom</h3>

    <div class="card p-4">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label>Classroom Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="e.g Grade 10A"
                    required
                >

            </div>
            <button type="submit" class="btn btn-primary">
                Create Classroom
            </button>
        </form>
    </div>
</div>
{% endblock %}
