{% extends 'base_dashboard.html' %}

{% block content %}

<div class="container mt-4">
    <h1>Add Subject</h1>
    <div class="card p-4">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label>Subject Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="e.g Mathematics"
                    required
                >
            </div>
            <button type="submit" class="btn btn-primary">
                Create Subject
            </button>
        </form>
    </div>
</div>

{% endblock %}
