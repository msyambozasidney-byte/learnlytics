<h2>Students</h2>

{% for student in students %}
    <h3>{{ student.name }} - {{ student.classroom }}</h3>

    <ul>
        {% for mark in student.mark_set.all %}
            <li>{{ mark.subject }}:{{ mark.score }}</li>
        {% empty %}
            <li>No marks available</li>
        {% endfor %}
    </ul>

{% empty %}
    <p>No students available</p>
{% endfor %}
